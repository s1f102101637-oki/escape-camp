<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダンス合宿サイト（試作）</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background-color: #000;
      color: #fff;
      overflow: hidden;
    }
    #intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: #000;
      z-index: 999;
      transition: opacity 1s ease;
    }
    #intro.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #player {
      width: 100%;
      height: 100%;
    }
    #main-content {
      display: none;
      padding: 20px;
      background-color: #fff;
      color: #333;
      overflow: auto;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 1.4rem;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p, li {
      font-size: 1rem;
      line-height: 1.6;
      color: #333;
    }
    ul {
      padding-left: 1.2em;
    }
    @media (min-width: 768px) {
      h1 { font-size: 2.5rem; }
      h2 { font-size: 2rem; }
      p, li { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<!-- イントロ動画 -->
<div id="intro">
  <div id="player"></div>
</div>

<!-- メインコンテンツ -->
<div id="main-content">
  <h1>ダンス合宿へようこそ！</h1>
  <p>この合宿では、飲み会、ダンス、花火、サウナを通じて思い出に残る時間を過ごします。</p>

  <h2>合宿の詳細</h2>
  <p>場所: 〇〇合宿施設（仮）</p>
  <p>日時: 2025年5月X日〜Y日（仮）</p>

  <h2>スケジュール</h2>
  <ul>
    <li>集合場所: 〇〇駅（仮）</li>
    <li>集合時間: 9:00（仮）</li>
    <li>解散日時: 18:00（仮）</li>
  </ul>

  <h2>持ち物</h2>
  <ul>
    <li>ダンスシューズ</li>
    <li>タオル</li>
    <li>飲み物（個人用）</li>
    <li>替えの衣類</li>
  </ul>

  <h2>注意事項</h2>
  <ul>
    <li>花火は21:00まで</li>
    <li>サウナ利用は一度に3名まで</li>
    <li>館内は禁煙（指定場所で喫煙可）</li>
  </ul>
</div>

<script>
  // YouTube URLから動画IDを抽出
  const youtubeUrl = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'; // 仮のURLを差し替えてください
  const urlObj = new URL(youtubeUrl);
  const videoId = urlObj.searchParams.get('v');

  let player;
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: videoId,
      playerVars: {
        autoplay: 1,
        controls: 0,
        showinfo: 0,
        modestbranding: 1,
        rel: 0,
        playsinline: 1
      },
      events: {
        onReady: event => event.target.playVideo(),
        onStateChange: event => {
          if (event.data === YT.PlayerState.ENDED) {
            document.getElementById('intro').classList.add('fade-out');
            setTimeout(() => {
              document.getElementById('intro').style.display = 'none';
              document.getElementById('main-content').style.display = 'block';
              document.body.style.overflow = 'auto';
            }, 1000);
          }
        }
      }
    });
  }

  // YouTube IFrame APIスクリプトを読み込む
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
</script>

</body>
</html>
